# Local / small-site deployment. For a pharmacy chain, run Postgres on managed
# infrastructure with its own backups and point DATABASE_URL at it — the
# application-level backup here is a second line of defence, not the only one.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharmacore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pharmacore
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacore"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pharmacore:${POSTGRES_PASSWORD}@db:5432/pharmacore?schema=public
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      # Backups contain patient and controlled-drug records; the service
      # refuses to write one without this.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?set BACKUP_ENCRYPTION_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - uploads:/repo/apps/api/uploads
      - backups:/repo/apps/api/backups
    ports:
      - "4000:4000"
    # Run migrations before serving: the schema must match the code.
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main.js"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  backups:
